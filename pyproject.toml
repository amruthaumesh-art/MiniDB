
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minidb-engine"
version = "0.1.0"
description = "A lightweight educational database engine built in Python."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["minidb", "minidb.plugins"]
